<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Formula Solver</title>
<meta name="description" content="Type in the quantities you know and the rest is solved from the formulas. The formula sets come from a JSON file.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Source+Serif+4:ital,wght@0,400;0,600;1,400;1,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<script>
/* Set the theme early so there is no flash of the wrong one.
   Order: the viewer's own choice > an existing data-theme > system setting. */
(function () {
  var root = document.documentElement, t = null;
  try { t = localStorage.getItem('formulasolver.theme'); } catch (e) {}
  if (!t) t = root.getAttribute('data-theme');
  if (!t) t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  root.setAttribute('data-theme', t);
})();
</script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230b6fb0'/%3E%3Ctext x='50' y='72' font-size='64' font-family='Georgia,serif' font-style='italic' fill='white' text-anchor='middle'%3E%C6%92%3C/text%3E%3C/svg%3E">
</head>
<body>

<div class="layout">

  <!-- ------------------------------------------------------- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark">&#402;</div>
      <div>
        <div class="brand-title">Formula Solver</div>
        <div class="brand-sub">3.0 &middot; Web</div>
      </div>
    </div>

    <div class="search-wrap">
      <span class="search-icon">&#9906;</span>
      <input id="search" class="search" type="search" placeholder="Search&hellip;" autocomplete="off" spellcheck="false">
      <kbd>/</kbd>
    </div>

    <nav class="nav" id="nav"></nav>

    <div class="sidebar-foot">
      <button class="btn btn-ghost" id="btn-new">+&nbsp; New formula set</button>
      <div class="foot-row">
        <button class="btn sm" id="btn-import" title="Load a JSON file">Import</button>
        <button class="btn sm" id="btn-export" title="Save as formulas.json">Export</button>
        <button class="btn sm icon" id="btn-theme" style="flex:none">&#9790;</button>
      </div>
      <div class="foot-row">
        <button class="btn btn-ghost sm" id="btn-copy" title="Copy the whole database as JSON">Copy JSON</button>
        <button class="btn btn-ghost sm" id="btn-reload" title="Discard local changes">Reload file</button>
      </div>
      <div class="muted xs" id="source-line"></div>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <!-- ---------------------------------------------------------- Main -->
  <main class="main">
    <header class="topbar">
      <button class="btn btn-ghost icon only-mobile" id="btn-menu" title="Menu">&#9776;</button>
      <div class="crumbs">
        <span class="crumb-cat" id="crumb-cat"></span>
        <span class="crumb-sep" id="crumb-sep">/</span>
        <span class="crumb-name" id="crumb-name">Formula Solver</span>
      </div>
      <div class="topbar-actions">
        <button class="btn sm" id="btn-reset" disabled>Reset</button>
        <button class="btn sm" id="btn-edit" disabled>Edit</button>
      </div>
    </header>
    <div class="content" id="content"></div>
  </main>
</div>

<!-- ----------------------------------------------------------- Editor -->
<div class="modal-backdrop" id="modal">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="ed-title">
    <div class="modal-head">
      <h2 id="ed-title">Edit formula set</h2>
      <span class="spacer"></span>
      <button class="btn btn-ghost icon" id="btn-ed-close" title="Close">&#10005;</button>
    </div>

    <div class="modal-body">
      <div class="form-grid">
        <div>
          <label class="lbl" for="ed-name">Name</label>
          <input class="inp" id="ed-name" placeholder="Voltage divider, unloaded">
        </div>
        <div>
          <label class="lbl" for="ed-cat">Category (JSON field &ldquo;Untermenu&rdquo;)</label>
          <input class="inp" id="ed-cat" list="ed-cats" placeholder="Fundamentals">
          <datalist id="ed-cats"></datalist>
        </div>
      </div>

      <div>
        <div class="erow-head" style="margin-bottom:6px">
          <span>Symbol</span><span>Unit</span><span>Description</span><span></span>
        </div>
        <div class="editor-rows" id="ed-rows"></div>
        <button class="btn btn-ghost sm" id="btn-ed-addvar" style="margin-top:7px">+ Quantity</button>
      </div>

      <div>
        <label class="lbl">Formulas &mdash; <code>target quantity, expression</code></label>
        <div class="editor-rows" id="ed-formulas"></div>
        <button class="btn btn-ghost sm" id="btn-ed-addformula" style="margin-top:7px">+ Formula</button>
        <div class="hint" style="margin-top:9px">
          Same notation as the Python version:
          <code>Rges, R1 + R2</code>, <code>Pow(I, 2)</code> or <code>I**2</code>,
          <code>sqrt(x)</code>, <code>log(x, 10)</code>, <code>pi</code>, <code>E</code>.
          Every formula can be used in any direction &ndash; it is rearranged automatically.
        </div>
      </div>

      <div id="ed-problems"></div>
    </div>

    <div class="modal-foot">
      <button class="btn btn-danger sm" id="btn-ed-delete">Delete</button>
      <span class="spacer"></span>
      <button class="btn" id="btn-ed-cancel">Cancel</button>
      <button class="btn btn-primary" id="btn-ed-save">Save</button>
    </div>
  </div>
</div>

<div class="dropzone" id="dropzone"><div class="dz-inner">Drop a JSON file here</div></div>
<div class="toasts" id="toasts"></div>
<input type="file" id="file-input" accept=".json,application/json" style="display:none">
